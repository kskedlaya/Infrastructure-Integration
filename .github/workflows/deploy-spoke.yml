name: Deploy Orchestrator

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Install Bicep
      run: |
        az bicep install
        az bicep upgrade

    - name: Create Resource Group
      run: |
        az group create \
          --name rg-orchestrator \
          --location canadacentral

    - name: Deploy Orchestrator Bicep
      run: |
        az deployment group create \
          --resource-group rg-orchestrator \
          --template-file Spoke/Orchestrator.bicep
