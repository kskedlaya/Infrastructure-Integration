name: Deploy Orchestrator

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  orchestrator:
    uses: ./.github/workflows/Shared-Deploy.yml@${{ github.ref }}
    with:
      resourceGroup: rg-orchestrator
      location: canadacentral
      templateFile: Spoke/Orchestrator.bicep
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}